[project]
name = "edgerollup"
version = "0.1.0"
description = "Retention tiering and rollup pipeline for the adaptive-edge-otel storage backends"
# 3.11 is the floor because that is the interpreter on the primary dev machine, and
# unlike the sibling project there is no container here -- this job runs directly on
# whichever host schedules it, so the local interpreter IS the target.
requires-python = ">=3.11"

dependencies = [
    # The sibling's integration suite already standardises on httpx; matching it keeps
    # one HTTP client idiom across both repos.
    "httpx>=0.28",
    # Parquet writing for the cold-tier archive. Also the only in-memory table
    # representation in the project -- see decisions.md D-006 on why pandas is absent.
    "pyarrow>=18.0",
    # Config from .env + environment, same pattern as the sibling's app.
    "pydantic-settings>=2.6",
    # rollup.yaml is declarative config, not code.
    "pyyaml>=6.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.3",
    "ruff>=0.8",
]

[project.scripts]
# The single entrypoint. orchestration/run_rollup.sh wraps this for cron; developers
# call it directly.
edge-rollup = "edgerollup.cli:main"

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
addopts = "-q --strict-markers"
markers = [
    "integration: requires the sibling adaptive-edge-otel stack to be running",
]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "SIM", "RUF"]
