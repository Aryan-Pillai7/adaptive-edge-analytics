# CI is scoped to checks that would actually have caught a real break in this repo.
#
# Two jobs for now, cheapest first:
#
#   lint   seconds   — yaml, ruff, shellcheck
#   unit   seconds   — aggregation logic against fixtures, no stack, no network
#
# There is deliberately NO integration job, and the reason is structural rather than
# effort. The read gate in tests/integration/ asserts on windows that are two full grace
# periods in the past — up to 40 minutes for traces — because reads must not race
# ingestion. A CI job would have to boot the sibling stack, generate traffic, and then
# idle for the better part of an hour before it could assert anything. Any attempt to
# shorten that produces a suite that skips itself and reports green, which is worse than
# not running it: it looks like coverage.
#
# So the integration suite is a local gate, run against a real stack that has been alive
# for a while (`bash scripts/test.sh --integration`). CI covers what CI can actually
# cover honestly.
#
# The unit job is the one that matters most here anyway. The failure modes this project
# has to avoid — double-counting across runs, missing data at a tier boundary, schema
# drift — are logic bugs reproducible from recorded fixtures, and tests/unit/ reproduces
# each backend's real misbehaviour (inclusive window ends, silent truncation, overlap
# matching) against a fake that misbehaves the same way.

name: ci

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  lint:
    name: lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"   # the interpreter the primary dev machine runs

      # Deliberately does NOT apt-get shellcheck. scripts/lint.sh falls back to a PINNED
      # Docker image when no shellcheck binary is on PATH, and runners have Docker — so
      # skipping the install is what makes CI and a developer's machine run the same
      # version.
      #
      # They previously did not. Ubuntu's packaged shellcheck reported an unreachable
      # function as SC2317 while the pinned v0.11.0 reported the same finding as SC2329,
      # so a suppression that silenced it locally still failed CI. A lint that disagrees
      # with itself across environments is worse than a slightly slower one.
      - name: install lint deps
        run: |
          python -m pip install --upgrade pip
          pip install pyyaml ruff

      - name: lint
        run: bash scripts/lint.sh

  unit:
    name: unit tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: pyproject.toml

      - name: install
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev]"

      # Unit tests only. tests/integration/ needs the sibling adaptive-edge-otel stack,
      # which does not exist on a runner — and `-m "not integration"` here means a
      # forgotten marker shows up as an ImportError in CI rather than as a job that
      # quietly tries to reach localhost:8428 and times out.
      - name: unit tests
        run: python -m pytest tests/unit -q

      # The CLI is what cron actually invokes. A package that imports fine but whose
      # entrypoint fails to build its parser is a broken deploy, and it is one second
      # to rule out.
      - name: entrypoint smoke
        run: |
          edge-rollup --version
          edge-rollup --help > /dev/null
          edge-rollup status
